version: "2"
run:
  modules-download-mode: readonly
linters:
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
   
  settings:
    goimports:
      local-prefixes:
        - order-service
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
