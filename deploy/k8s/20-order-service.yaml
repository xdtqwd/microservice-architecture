apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-service}
  template:
    metadata:
      labels: {app: order-service}
    spec:
      containers:
        - name: order-service
          image: order-service:dev
          imagePullPolicy: Never   # образ загружен через kind load, не тянуть из реестра
          # настройки — из ConfigMap, секреты — из Secret
          envFrom:
            - configMapRef: {name: order-service-config}
            - secretRef: {name: order-service-secrets}
          ports:
            - containerPort: 8083
          # Жив ли процесс. Без внешних зависимостей: перезапуск не чинит упавшую базу,
          # а только добавляет падений на старте и паузы CrashLoopBackOff.
          livenessProbe:
            httpGet: {path: /healthz, port: 8083}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          # Готов ли принимать трафик. Не готов — под убирают из балансировки,
          # но не трогают: как только база вернётся, он сразу снова в работе.
          readinessProbe:
            httpGet: {path: /readyz, port: 8083}
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orders
spec:
  selector: {app: order-service}
  ports:
    - port: 8083
