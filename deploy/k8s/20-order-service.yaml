# K8S-01: намеренно БЕЗ проб — посмотрим, чего Kubernetes не знает о сервисе.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-service}
  template:
    metadata:
      labels: {app: order-service}
    spec:
      containers:
        - name: order-service
          image: order-service:dev
          imagePullPolicy: Never   # образ загружен через kind load, не тянуть из реестра
          env:
            - {name: DATABASE_URL, value: "postgres://postgres:password@postgres:5432/orders_db?sslmode=disable"}
            - {name: REDIS_ADDR, value: "redis:6379"}
          ports:
            - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orders
spec:
  selector: {app: order-service}
  ports:
    - port: 8083
