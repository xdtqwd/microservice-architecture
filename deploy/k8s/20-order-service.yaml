apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: orders
spec:
  replicas: 3
  selector:
    matchLabels: {app: order-service}
  template:
    metadata:
      labels: {app: order-service}
    spec:
      # 5s паузы (/readyz уже 503, порт открыт — список адресов успевает
      # обновиться) + до 12s на текущие запросы + запас. Меньше — Kubernetes
      # убьёт под посреди запросов.
      terminationGracePeriodSeconds: 20
      containers:
        - name: order-service
          image: order-service:dev
          imagePullPolicy: Never   # образ загружен через kind load, не тянуть из реестра
          # настройки — из ConfigMap, секреты — из Secret
          envFrom:
            - configMapRef: {name: order-service-config}
            - secretRef: {name: order-service-secrets}
          ports:
            - containerPort: 8083
          # HPA считает загрузку от requests: 60% от 50m — это 30m на под.
          # При 100m под нагрузкой k6 выходило ровно ~60m = 60%, а HPA
          # не трогает реплики, пока отклонение меньше 10% (до ~66%).
          # Лимит по CPU не ставим: он душит под троттлингом раньше, чем HPA
          # успеет добавить реплики. Лимит по памяти — защита от утечки.
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          # Жив ли процесс. Без внешних зависимостей: перезапуск не чинит упавшую базу,
          # а только добавляет падений на старте и паузы CrashLoopBackOff.
          livenessProbe:
            httpGet: {path: /healthz, port: 8083}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          # Готов ли принимать трафик. Не готов — под убирают из балансировки,
          # но не трогают: как только база вернётся, он сразу снова в работе.
          readinessProbe:
            httpGet: {path: /readyz, port: 8083}
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orders
spec:
  selector: {app: order-service}
  ports:
    - port: 8083
