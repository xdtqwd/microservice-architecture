# Несекретные настройки order-service. Секреты — в Secret order-service-secrets,
# он создаётся командой из README и в git не хранится.
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: orders
data:
  REDIS_ADDR: "redis:6379"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"
  DB_ACQUIRE_TIMEOUT: "1s"
  SHUTDOWN_DRAIN_DELAY: "5s"
