apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: orders
---
# Role, а не ClusterRole: Prometheus нужно видеть поды только
# в своём namespace, остальной кластер его не касается.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: orders
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: orders
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: orders
roleRef:
  kind: Role
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: orders
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [orders]}
        relabel_configs:
          # собираем только поды с prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # адрес = IP пода + порт из аннотации
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          # метки, по которым потом группируем
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # стенд учебный: хранить сутки, данные в emptyDir
            - --storage.tsdb.retention.time=24h
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 5
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: orders
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      # по умолчанию правила проверяются раз в минуту, для стенда долго
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [orders]}
        relabel_configs:
          # собираем только поды с prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # адрес = IP пода + порт из аннотации
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          # метки, по которым потом группируем
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

  alerts.yml: |
    groups:
      - name: order-service
        rules:
          # Больше 1% ответов — 5xx, и так держится минуту.
          # for: 1m отсекает одиночные всплески: алерт сначала pending,
          # и только если ошибки не прошли — firing.
          - alert: OrderServiceHighErrorRate
            expr: |
              sum(rate(http_request_duration_seconds_count{app="order-service",status=~"5.."}[1m]))
                /
              sum(rate(http_request_duration_seconds_count{app="order-service"}[1m]))
                > 0.01
            for: 1m
            labels: {severity: page}
            annotations:
              summary: "order-service: {{ $value | humanizePercentage }} ответов 5xx"

          # Исчезнувший под пропадает из целей, поэтому up == 0 его не поймает.
          # Считаем живые цели: меньше двух — один отказ от полного простоя.
          - alert: OrderServiceFewReplicas
            expr: count(up{app="order-service"} == 1) < 2 or absent(up{app="order-service"} == 1)
            for: 30s
            labels: {severity: page}
            annotations:
              summary: "order-service: живых реплик меньше двух"